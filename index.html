<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credit Officer Performance Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  * { box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:Inter,system-ui,sans-serif;
    background:#0d1117;
    color:#e6edf3;
    min-height:100vh;
    padding:20px;
  }

  .ctrl-bar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:14px 16px;
    margin-bottom:18px;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:12px;
  }

  .load-btn,
  .run-btn,
  .export-btn{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
    transition:.2s;
  }

  .load-btn{
    background:#238636;
    color:#fff;
  }

  .run-btn{
    background:#1f6feb;
    color:#fff;
  }

  .export-btn{
    background:#8957e5;
    color:#fff;
  }

  .load-btn:hover,
  .run-btn:hover,
  .export-btn:hover{
    opacity:.9;
  }

  .load-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
  }

  .prog-wrap{
    flex:1;
    min-width:100px;
    height:6px;
    background:#30363d;
    border-radius:4px;
    overflow:hidden;
  }

  .prog-bar{
    height:100%;
    width:0%;
    background:#58a6ff;
    border-radius:4px;
    transition:width .25s;
  }

  .status-txt{
    font-size:12px;
    color:#8b949e;
    white-space:nowrap;
  }

  .err-box{
    color:#f85149;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:10px;
    padding:14px;
    font-size:13px;
    margin-bottom:16px;
  }

  .filter-bar{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:12px;
    padding:16px;
    align-items:end;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .field label{
    font-size:12px;
    color:#8b949e;
  }

  .field input,
  .field select{
    background:#0d1117;
    border:1px solid #30363d;
    color:#e6edf3;
    border-radius:8px;
    padding:10px 12px;
    min-width:180px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:16px;
    margin-bottom:20px;
  }

  .card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:14px;
    padding:18px;
  }

  .card h3{
    font-size:13px;
    color:#8b949e;
    margin-bottom:10px;
    font-weight:600;
  }

  .card .value{
    font-size:28px;
    font-weight:800;
    color:#58a6ff;
  }

  .chart-wrap{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
  }

  .chart-title{
    margin-bottom:16px;
    font-size:16px;
    font-weight:700;
  }

  .table-wrap{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:14px;
    overflow:auto;
  }

  table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
  }

  thead{
    background:#21262d;
  }

  th, td{
    padding:14px 12px;
    border-bottom:1px solid #30363d;
    text-align:left;
    font-size:13px;
    vertical-align:top;
  }

  th{
    color:#8b949e;
    font-weight:700;
  }

  tbody tr:hover{
    background:#1b222c;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    padding:4px 10px;
    border-radius:999px;
    background:#1f6feb22;
    color:#58a6ff;
    font-size:11px;
    font-weight:700;
  }

  .dropdown-details{
    background:#0d1117;
    padding:10px;
    border-radius:8px;
    border:1px solid #30363d;
    margin-top:10px;
  }

  .receipt-line{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid #222;
    font-size:12px;
  }

  .receipt-line:last-child{
    border-bottom:none;
  }

  .receipt-meta{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .empty{
    padding:50px 20px;
    text-align:center;
    color:#8b949e;
  }

  @media(max-width:768px){

    .field input,
    .field select{
      min-width:100%;
    }

    .filter-bar{
      flex-direction:column;
      align-items:stretch;
    }

    .run-btn,
    .export-btn{
      width:100%;
    }
  }
</style>

</head>

<body>

<div class="ctrl-bar">
  <button class="load-btn" id="load-btn" onclick="loadAllRecords()">⬇ Load All Records</button>

  <div class="prog-wrap">
    <div class="prog-bar" id="prog-bar"></div>
  </div>

  <span class="status-txt" id="status-txt">
    Press Load to fetch data from Manager
  </span>
</div>

<div id="app"></div>

<script>
/* ══════════════════════════════════
   postMessage helper — DO NOT MODIFY
══════════════════════════════════ */
function postMessageWithResponse(message) {
  return new Promise((resolve, reject) => {
    const requestId = crypto.randomUUID();
    const timer = setTimeout(() => {
      window.removeEventListener('message', handler);
      reject(new Error('Timeout — is this running inside Manager.io?'));
    }, 15000);
    function handler(event) {
      if (event.data?.type?.endsWith('-response') && event.data?.requestId === requestId) {
        clearTimeout(timer);
        window.removeEventListener('message', handler);
        resolve(event.data.body);
      }
    }
    window.addEventListener('message', handler);
    window.parent.postMessage({ ...message, requestId }, '*');
  });
}

/* ══════════════════════════════════
   Customer batch pagination
══════════════════════════════════ */
async function getCustomerBatch(onProgress) {
  const allItems = [];
  let nextToken = null;
  let pageNum = 0;
  let apiTotal = null;

  do {

    const path = nextToken
      ? '/api4/customer-batch?PageSize=99999&next_page_token=' + encodeURIComponent(nextToken)
      : '/api4/customer-batch?PageSize=99999';

    const data = await postMessageWithResponse({
      type:'api-request',
      method:'GET',
      path
    });

    const page = Array.isArray(data)
      ? data
      : (data.items || data.data || []);

    allItems.push(...page);

    nextToken =
      data.next_page_token ||
      data.nextPageToken ||
      data._links?.next?.href ||
      null;

    if(apiTotal === null){
      apiTotal =
        data.totalCount ??
        data.total ??
        data.count ??
        data._metadata?.totalCount ??
        null;
    }

    pageNum++;

    if(onProgress){
      onProgress(allItems.length, apiTotal, pageNum);
    }

    if(pageNum >= 1000) break;

  } while(nextToken);

  return allItems;
}

/* ══════════════════════════════════
   Generic loader
══════════════════════════════════ */
async function fetchAllPages(endpoint){

  const allItems = [];
  let nextToken = null;
  let pageNum = 0;

  do {

    const path = nextToken
      ? endpoint + '?PageSize=99999&next_page_token=' + encodeURIComponent(nextToken)
      : endpoint + '?PageSize=99999';

    const data = await postMessageWithResponse({
      type:'api-request',
      method:'GET',
      path
    });

    const page = Array.isArray(data)
      ? data
      : (data.items || data.data || []);

    allItems.push(...page);

    nextToken =
      data.next_page_token ||
      data.nextPageToken ||
      data._links?.next?.href ||
      null;

    pageNum++;

    if(pageNum >= 1000) break;

  } while(nextToken);

  return allItems;
}

/* ══════════════════════════════════
   Globals
══════════════════════════════════ */
let CUSTOMERS = [];
let RECEIPTS = [];
let JOURNALS = [];
let DASHBOARD_DATA = [];
let CUSTOMER_MAP = {};

/* ══════════════════════════════════
   Helpers
══════════════════════════════════ */
const fmtMoney = v =>
  '₦' + Number(v || 0).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

const fmtDate = d => {
  if(!d) return '-';
  return new Date(d).toLocaleDateString();
};

/* ══════════════════════════════════
   Load records
══════════════════════════════════ */
async function loadAllRecords(){

  const btn = document.getElementById('load-btn');
  const bar = document.getElementById('prog-bar');
  const status = document.getElementById('status-txt');
  const app = document.getElementById('app');

  btn.disabled = true;
  btn.textContent = 'Loading…';

  app.innerHTML = '';
  bar.style.width = '0%';

  try{

    CUSTOMERS = await getCustomerBatch((loaded,total,page)=>{

      status.textContent = total
        ? `Customers Page ${page} · ${loaded.toLocaleString()} / ${total.toLocaleString()}`
        : `Customers Page ${page} · ${loaded.toLocaleString()} loaded`;

      if(total){
        bar.style.width = Math.min(30, Math.round(loaded/total*30)) + '%';
      }
    });

    status.textContent = 'Loading receipts...';
    RECEIPTS = await fetchAllPages('/api4/receipt-batch');
    bar.style.width = '65%';

    status.textContent = 'Loading journal entries...';
    JOURNALS = await fetchAllPages('/api4/journal-entry-batch');
    bar.style.width = '100%';

    CUSTOMER_MAP = {};

    CUSTOMERS.forEach(c=>{
      CUSTOMER_MAP[c?.key] = c?.item?.name || 'Unknown Customer';
    });

    status.textContent =
      `✓ Customers: ${CUSTOMERS.length.toLocaleString()} | Receipts: ${RECEIPTS.length.toLocaleString()} | Journals: ${JOURNALS.length.toLocaleString()}`;

    btn.disabled = false;
    btn.textContent = '↺ Reload';

    render(CUSTOMERS);

  } catch(err){

    btn.disabled = false;
    btn.textContent = '↺ Retry';

    status.textContent = '⚠ ' + err.message;

    app.innerHTML = `
      <div class="err-box">
        ⚠ ${err.message}<br><br>
        Make sure this extension is running inside Manager.io
      </div>
    `;
  }
}

/* ══════════════════════════════════
   Export CSV
══════════════════════════════════ */
function exportCSV(){

  if(!DASHBOARD_DATA.length){
    alert('No data available');
    return;
  }

  const headers = [
    'Credit Officer',
    'Loan Disbursed',
    'Receipt Count',
    'Total Receipts'
  ];

  const rows = DASHBOARD_DATA.map(r=>[
    r.name,
    r.loanCount,
    r.receiptCount,
    r.receiptAmount
  ]);

  const csv = [
    headers.join(','),
    ...rows.map(r=>r.join(','))
  ].join('\n');

  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'credit-officer-performance.csv';
  a.click();

  URL.revokeObjectURL(url);
}

/* ══════════════════════════════════
   Apply filters and calculate
══════════════════════════════════ */
function applyFilters(){

  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;
  const officer = document.getElementById('co-filter').value;

  const startDate = start ? new Date(start + 'T00:00:00') : null;
  const endDate = end ? new Date(end + 'T23:59:59.999') : null;

  const summary = {};

  /* Build CO list from customers */
  CUSTOMERS.forEach(customer=>{

    const strings = customer?.item?.customFields2?.strings || {};

    const officerName =
      strings['50ca827c-17af-4164-bc29-453df6192f02'] ||
      'Unassigned';

    if(!summary[officerName]){
      summary[officerName] = {
        name:officerName,
        loanCount:0,
        receiptAmount:0,
        receiptCount:0,
        receipts:[]
      };
    }
  });

  /* LOAN DISBURSED
     Using CUSTOMER LOAN DISBURSED DATE custom field
  */
  CUSTOMERS.forEach(customer=>{

    const strings = customer?.item?.customFields2?.strings || {};

    const officerName =
      strings['50ca827c-17af-4164-bc29-453df6192f02'] ||
      'Unassigned';

    if(officer && officer !== officerName) return;

    /* Loan disbursed date custom field */
    const loanDate =
      customer?.item?.customFields2?.dates?.['2590d968-ad43-42ab-8f13-0f9adc53fed7'];

    if(!loanDate) return;

    const loanDt = new Date(loanDate);

    if(startDate && loanDt.getTime() < startDate.getTime()) return;
    if(endDate && loanDt.getTime() > endDate.getTime()) return;

    summary[officerName].loanCount += 1;
  });

  /* RECEIPTS */
  RECEIPTS.forEach(receipt=>{

    const receiptDate = receipt?.item?.date
  ? new Date(receipt.item.date)
  : null;

  if(startDate && receiptDate && receiptDate.getTime() < startDate.getTime()) return;
  if(endDate && receiptDate && receiptDate.getTime() > endDate.getTime()) return;

    const customerKey = receipt?.item?.customer;
    const customerName = CUSTOMER_MAP[customerKey] || 'Unknown Customer';

    const lines = receipt?.item?.lines || [];

    lines.forEach(line=>{

      const strings = line?.customFields2?.strings || {};

      const officerName =
        strings['50ca827c-17af-4164-bc29-453df6192f02'] ||
        'Unassigned';

      if(officer && officer !== officerName) return;

      const amount = Number(line?.amount || 0);

      if(!summary[officerName]){
        summary[officerName] = {
          name:officerName,
          loanCount:0,
          receiptAmount:0,
          receiptCount:0,
          receipts:[]
        };
      }

      summary[officerName].receiptAmount += amount;
      summary[officerName].receiptCount += 1;

      summary[officerName].receipts.push({
        date: receipt?.item?.date,
        reference: receipt?.item?.reference || '-',
        customerName,
        amount
      });
    });
  });

  DASHBOARD_DATA = Object.values(summary)
    .sort((a,b)=>b.receiptAmount - a.receiptAmount);

  renderDashboard();
}

/* ══════════════════════════════════
   Dashboard
══════════════════════════════════ */
function renderDashboard(){

  const tableBody = document.getElementById('table-body');

  if(!DASHBOARD_DATA.length){

    tableBody.innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            No records found for selected filters
          </div>
        </td>
      </tr>
    `;

    return;
  }

  const totalLoans =
    DASHBOARD_DATA.reduce((a,b)=>a+b.loanCount,0);

  const totalReceipts =
    DASHBOARD_DATA.reduce((a,b)=>a+b.receiptAmount,0);

  const totalReceiptCount =
    DASHBOARD_DATA.reduce((a,b)=>a+b.receiptCount,0);

  document.getElementById('loan-total').textContent =
    totalLoans.toLocaleString();

  document.getElementById('receipt-total').textContent =
    fmtMoney(totalReceipts);

  document.getElementById('receipt-count').textContent =
    totalReceiptCount.toLocaleString();

  document.getElementById('co-count').textContent =
    DASHBOARD_DATA.length.toLocaleString();

  tableBody.innerHTML = DASHBOARD_DATA.map(row=>`

    <tr>

      <td>
        <span class="badge">${row.name}</span>
      </td>

      <td>${row.loanCount.toLocaleString()}</td>

      <td>${row.receiptCount.toLocaleString()}</td>

      <td>${fmtMoney(row.receiptAmount)}</td>

      <td>

        <details>

          <summary style="cursor:pointer;color:#58a6ff">
            View Breakdown (${row.receipts.length})
          </summary>

          <div class="dropdown-details">

            ${
              row.receipts.length
              ? row.receipts.map(r=>`

                <div class="receipt-line">

                  <div class="receipt-meta">
                    <span><strong>Ref:</strong> ${r.reference}</span>
                    <span>${r.customerName}</span>
                  </div>

                  <strong>${fmtMoney(r.amount)}</strong>

                </div>

              `).join('')
              : '<div style="color:#8b949e">No receipt breakdown</div>'
            }

          </div>

        </details>

      </td>

    </tr>

  `).join('');

  renderChart();
}

/* ══════════════════════════════════
   Chart
══════════════════════════════════ */
let chartInstance = null;

function renderChart(){

  const ctx = document.getElementById('co-chart');

  if(chartInstance){
    chartInstance.destroy();
  }

  chartInstance = new Chart(ctx,{

    type:'bar',

    data:{
      labels:DASHBOARD_DATA.map(d=>d.name),

      datasets:[
        {
          label:'Receipt Amount',
          data:DASHBOARD_DATA.map(d=>d.receiptAmount),
          backgroundColor:'#58a6ff'
        },
        {
          label:'Loan Disbursed',
          data:DASHBOARD_DATA.map(d=>d.loanCount),
          backgroundColor:'#238636'
        }
      ]
    },

    options:{

      responsive:true,
      maintainAspectRatio:false,

      plugins:{
        legend:{
          labels:{
            color:'#e6edf3'
          }
        }
      },

      scales:{

        x:{
          ticks:{ color:'#e6edf3' },
          grid:{ color:'#30363d' }
        },

        y:{
          ticks:{ color:'#e6edf3' },
          grid:{ color:'#30363d' }
        }
      }
    }
  });
}

/* ══════════════════════════════════
   Initial render
══════════════════════════════════ */
function render(items){

  const app = document.getElementById('app');

  if(!items || !items.length){

    app.innerHTML = `
      <div class="empty">
        No customer records available
      </div>
    `;

    return;
  }

  const officers = [...new Set(

    items.map(c=>
      c?.item?.customFields2?.strings?.['50ca827c-17af-4164-bc29-453df6192f02']
    ).filter(Boolean)

  )].sort();

  app.innerHTML = `

    <div class="filter-bar">

      <div class="field">
        <label>Start Date</label>
        <input type="date" id="start-date">
      </div>

      <div class="field">
        <label>End Date</label>
        <input type="date" id="end-date">
      </div>

      <div class="field">
        <label>Credit Officer</label>

        <select id="co-filter">

          <option value="">All Credit Officers</option>

          ${officers.map(o=>`
            <option value="${o}">${o}</option>
          `).join('')}

        </select>
      </div>

      <button class="run-btn" onclick="applyFilters()">
        ▶ Run Analysis
      </button>

      <button class="export-btn" onclick="exportCSV()">
        ⬇ Export Analysis
      </button>

    </div>

    <div class="grid">

      <div class="card">
        <h3>Total Loan Disbursed</h3>
        <div class="value" id="loan-total">0</div>
      </div>

      <div class="card">
        <h3>Total Receipt Amount</h3>
        <div class="value" id="receipt-total">₦0.00</div>
      </div>

      <div class="card">
        <h3>Total Receipt Count</h3>
        <div class="value" id="receipt-count">0</div>
      </div>

      <div class="card">
        <h3>Total Credit Officers</h3>
        <div class="value" id="co-count">0</div>
      </div>

    </div>

    <div class="chart-wrap">

      <div class="chart-title">
        Credit Officer Performance Analysis
      </div>

      <div style="height:400px">
        <canvas id="co-chart"></canvas>
      </div>

    </div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Credit Officer</th>
            <th>Loan Disbursed</th>
            <th>Receipt Count</th>
            <th>Total Receipt Amount</th>
            <th>Receipt Breakdown</th>
          </tr>

        </thead>

        <tbody id="table-body"></tbody>

      </table>

    </div>
  `;

  applyFilters();
}
</script>

</body>
</html>
